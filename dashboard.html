<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />
<title>Dashboard | PaperlyTools</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<meta name="description"
content="Access your PaperlyTools dashboard to manage your files, AI tools and PDF processing tasks." />

<link rel="stylesheet" href="assets/css/style.css" />

<!-- ===============================
DASHBOARD ACCESS PROTECTION
=============================== -->
<script type="module">

import { isLoggedIn } from "/assets/js/auth.js";

if (!isLoggedIn()) {
  console.warn("🚫 Unauthorized dashboard access");
  window.location.href = "/login.html";
}

</script>

<style>

/* ===============================
DASHBOARD UI
=============================== */

.dashboard-container{
  padding-top:120px;
  padding-bottom:60px;
}

.dashboard-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  margin-bottom:30px;
}

.plan-badge{
  padding:6px 12px;
  border-radius:20px;
  font-size:13px;
  font-weight:600;
}

.plan-free{
  background:#444;
  color:#fff;
}

.plan-pro{
  background:linear-gradient(135deg,#00f0ff,#00ffa6);
  color:#000;
}

.usage-box{
  margin-top:10px;
  font-size:14px;
}

.usage-bar{
  margin-top:8px;
  height:8px;
  background:#222;
  border-radius:10px;
  overflow:hidden;
}

.usage-fill{
  height:100%;
  background:#00ffa6;
  width:0%;
  transition:0.3s;
}

.upgrade-banner{
  margin-top:20px;
  padding:20px;
  border-radius:12px;
  background:linear-gradient(135deg,#1a1a2e,#16213e);
}

.tools-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin-top:30px;
}

.tool-card{
  padding:20px;
  border-radius:12px;
  background:#111;
  border:1px solid rgba(255,255,255,0.08);
}

.tool-card.disabled{
  opacity:0.4;
  pointer-events:none;
}

.tool-card.locked{
  opacity:0.5;
  position:relative;
}

.tool-card.locked::after{
  content:"PRO";
  position:absolute;
  top:10px;
  right:10px;
  font-size:10px;
  background:#ffcc00;
  color:#000;
  padding:4px 6px;
  border-radius:4px;
}

.tool-title{
  font-size:16px;
  font-weight:600;
}

</style>

</head>

<body>

<div id="site-header"></div>

<section class="dashboard-container">

<div class="container">

<div class="dashboard-header">

<div>
<h1 id="welcomeText">Welcome</h1>

<div class="usage-box" id="usageText">
Loading usage...
</div>

<div class="usage-bar">
  <div id="usageFill" class="usage-fill"></div>
</div>

</div>

<div id="planBadge" class="plan-badge plan-free">
Free Plan
</div>

</div>

<div id="upgradeBanner" class="upgrade-banner" style="display:none;">
  <h3>Upgrade to Pro 🚀</h3>
  <p>Unlock unlimited tools & remove limits.</p>
  <a href="/pricing.html" class="dynamic-link" data-path="pricing.html">Upgrade Now</a>
</div>

<div class="tools-grid">

<div class="tool-card" id="tool1">
  <div class="tool-title">Merge PDF</div>
  <a class="dynamic-link" data-path="tools/merge-pdf.html">Open Tool</a>
</div>

<div class="tool-card" id="tool2">
  <div class="tool-title">Compress PDF</div>
  <a class="dynamic-link" data-path="tools/compress-pdf.html">Open Tool</a>
</div>

<div class="tool-card locked" id="aiTool">
  <div class="tool-title">AI PDF Summarizer</div>
  <a class="dynamic-link" data-path="tools/ai-summarizer.html">Open Tool</a>
</div>

</div>

</div>

</section>

<div id="site-footer"></div>

<!-- ===============================
LOGIC
=============================== -->

<script type="module">

import {
  getCurrentUser,
  getUserPlan,
  getToken
} from "/assets/js/auth.js";

/*
---------------------------------
INIT
---------------------------------
*/

const user = getCurrentUser();
const plan = getUserPlan() || "free";

if (user?.name) {
  document.getElementById("welcomeText").innerText =
    "Welcome, " + user.name;
}

/*
---------------------------------
PLAN BADGE
---------------------------------
*/

const badge = document.getElementById("planBadge");

if (plan === "pro") {
  badge.innerText = "Pro Plan";
  badge.classList.add("plan-pro");
} else {
  document.getElementById("upgradeBanner").style.display = "block";
}

/*
---------------------------------
FETCH REAL USAGE
---------------------------------
*/

async function loadUsage() {

  try {

    const res = await fetch("https://pdf-tools-api-c4f5.onrender.com/api/usage", {
      headers: {
        Authorization: "Bearer " + getToken()
      }
    });

    const data = await res.json();

    /*
    Expected:
    dailyUsageCount
    dailyLimit
    */

    const used = data.dailyUsageCount || 0;
    const limit = data.dailyLimit || 5;

    const remaining = limit - used;

    document.getElementById("usageText").innerText =
      plan === "pro"
        ? "Unlimited usage enabled"
        : `${used} / ${limit} used • ${remaining} remaining`;

    /*
    PROGRESS BAR
    */

    const percent = Math.min((used / limit) * 100, 100);
    document.getElementById("usageFill").style.width = percent + "%";

    /*
    LIMIT REACHED → DISABLE TOOLS
    */

    if (plan !== "pro" && used >= limit) {

      document.getElementById("usageText").innerText =
        "Limit reached. Upgrade to continue.";

      document.querySelectorAll(".tool-card").forEach(card => {
        card.classList.add("disabled");
      });

    }

  } catch (err) {
    console.error("Usage fetch failed", err);
    document.getElementById("usageText").innerText =
      "Unable to load usage data";
  }

}

loadUsage();

/*
---------------------------------
UNLOCK PRO FEATURES
---------------------------------
*/

if (plan === "pro") {
  document.getElementById("aiTool").classList.remove("locked");
}

</script>

<script src="assets/js/includes.js"></script>

</body>

</html>
