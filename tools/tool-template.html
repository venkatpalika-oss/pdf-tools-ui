<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF Tool</title>

<link rel="stylesheet" href="../assets/css/style.css">

</head>

<body>

<div id="site-header"></div>

<section class="tool-section">
<div class="container">

<h1 class="tool-title">PDF Tool</h1>

<p class="tool-description">
Upload your PDF file and process it using PaperlyTools.
</p>

<div class="upload-box">

<input type="file" id="fileInput" accept=".pdf">

<button id="processBtn">
Process File
</button>

</div>

<div id="resultBox" style="margin-top:20px;"></div>

</div>
</section>

<div id="site-footer"></div>

<script src="../assets/js/includes.js"></script>

<script type="module" src="../assets/js/tool-loader.js"></script>
<script type="module" src="../assets/js/app.js"></script>

</body>
</html>
