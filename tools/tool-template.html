<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF Tool</title>

<link rel="stylesheet" href="../assets/css/style.css">

</head>

<body>

<div id="site-header"></div>

<section class="tool-section">
<div class="container">

<h1 class="tool-title">PDF Tool</h1>

<p class="tool-description">
Upload your PDF file and process it using PaperlyTools.
</p>

<div class="upload-box">

  <input type="file" class="file-input" multiple />

  <div class="upload-title">
    Drop your file here or click to upload
  </div>

  <div class="file-queue"></div>

  <div class="progress-container" style="display:none;">
    <div class="progress-bar"></div>
  </div>

</div>

<div id="resultBox" style="margin-top:20px;"></div>

</div>
</section>

<div id="site-footer"></div>

<script src="../assets/js/includes.js"></script>

<script type="module" src="../assets/js/tool-loader.js"></script>
<script type="module" src="../assets/js/app.js"></script>

</body>
</html>
