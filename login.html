<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Login | PaperlyTools</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>

<div id="site-header"></div>

<section class="hero" style="padding-top:120px;">
<div class="container" style="max-width:420px;">

<h2 style="text-align:center;margin-bottom:30px;">
Login to Your Account
</h2>

<form id="loginForm">

<input
type="email"
id="email"
placeholder="Email"
required
style="width:100%;padding:12px;margin-bottom:15px;border-radius:6px;border:none;"
/>

<input
type="password"
id="password"
placeholder="Password"
required
style="width:100%;padding:12px;margin-bottom:15px;border-radius:6px;border:none;"
/>

<button
type="submit"
style="width:100%;padding:12px;border-radius:6px;cursor:pointer;"
>
Login
</button>

</form>

<p id="errorMessage"
style="color:#ff6b6b;margin-top:15px;text-align:center;">
</p>

<button
id="resendBtn"
style="display:none;margin-top:10px;width:100%;padding:10px;border-radius:6px;cursor:pointer;"
>
Resend Verification Email
</button>

<p style="margin-top:20px;text-align:center;">
Don’t have an account?
<a href="signup.html">Sign Up</a>
</p>

</div>
</section>

<div id="site-footer"></div>

<script src="assets/js/includes.js"></script>

<script type="module">

import { apiRequest } from "./assets/js/api.js";
import { saveToken } from "./assets/js/auth.js";

const form = document.getElementById("loginForm");
const errorMessage = document.getElementById("errorMessage");
const resendBtn = document.getElementById("resendBtn");

form.addEventListener("submit", async (e) => {

e.preventDefault();

errorMessage.textContent = "";
resendBtn.style.display = "none";

const email = document.getElementById("email").value.trim();
const password = document.getElementById("password").value.trim();

const data = await apiRequest("/api/auth/login", {
method: "POST",
headers: {
"Content-Type": "application/json"
},
body: JSON.stringify({ email, password })
});

if (data?.token) {

saveToken(data.token);

window.location.href = "/";

return;

}

const error = data?.error || "Login failed. Please try again.";

errorMessage.textContent = error;

/* ================= SHOW RESEND BUTTON ================= */

if (error.toLowerCase().includes("verify")) {
resendBtn.style.display = "block";
}

});

/* ================= RESEND VERIFICATION ================= */

resendBtn.addEventListener("click", async () => {

const email = document.getElementById("email").value.trim();

if (!email) {
errorMessage.textContent = "Enter your email first.";
return;
}

const response = await apiRequest("/api/auth/resend-verification", {
method: "POST",
headers: {
"Content-Type": "application/json"
},
body: JSON.stringify({ email })
});

if (response?.message) {

errorMessage.style.color = "#4ade80";
errorMessage.textContent =
"Verification email sent. Please check your inbox.";

resendBtn.style.display = "none";

}
else {

errorMessage.textContent =
response?.error || "Failed to resend verification email.";

}

});

</script>

</body>
</html>
