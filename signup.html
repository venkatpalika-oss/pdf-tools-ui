<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Sign Up | PaperlyTools</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="assets/css/style.css" />

<script type="module">

import { isLoggedIn } from "/assets/js/auth.js";

document.addEventListener("DOMContentLoaded", () => {

  if (isLoggedIn()) {
    window.location.href = "/dashboard.html";
  }

});

</script>

</head>

<body>

<div id="site-header"></div>

<section class="hero" style="padding-top:120px;">
<div class="container" style="max-width:420px;">

<h2 style="text-align:center;margin-bottom:30px;">
Create Your Account
</h2>

<form id="signupForm">

<input
type="email"
id="email"
placeholder="Email"
required
style="width:100%;padding:12px;margin-bottom:15px;border-radius:6px;border:none;"
/>

<input
type="password"
id="password"
placeholder="Password"
required
minlength="6"
style="width:100%;padding:12px;margin-bottom:15px;border-radius:6px;border:none;"
/>

<button
type="submit"
style="width:100%;padding:12px;border-radius:6px;cursor:pointer;"
>
Create Account
</button>

</form>

<p id="message"
style="margin-top:15px;text-align:center;">
</p>

<p style="margin-top:20px;text-align:center;">
Already have an account?
<a href="login.html">Login</a>
</p>

</div>
</section>

<div id="site-footer"></div>

<script src="assets/js/includes.js"></script>

<script type="module">

import { apiRequest } from "./assets/js/api.js";

const form = document.getElementById("signupForm");
const message = document.getElementById("message");

form.addEventListener("submit", async (e) => {

e.preventDefault();

message.style.color = "#fff";
message.textContent = "Creating account...";

const email = document.getElementById("email").value.trim();
const password = document.getElementById("password").value.trim();

/* ================= REGISTER ================= */

const data = await apiRequest("/api/auth/register", {
method: "POST",
headers: {
"Content-Type": "application/json"
},
body: JSON.stringify({ email, password })
});

if (!data || data.error) {

message.style.color = "#ff6b6b";
message.textContent =
data?.error || "Signup failed. Try again.";

return;

}

/* ================= SUCCESS MESSAGE ================= */

message.style.color = "#4ade80";

message.innerHTML = `
Account created successfully.<br><br>
Please check your email to verify your account before logging in.
`;

form.reset();

});

</script>

</body>
</html>
