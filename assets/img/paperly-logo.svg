<!-- PaperlyTools Logo SVG (Animated Spark Version) -->
<svg viewBox="0 0 64 64"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     aria-label="PaperlyTools Logo">

  <defs>

    <!-- Gradients -->
    <linearGradient id="paperGradient" x1="14" y1="10" x2="44" y2="54">
      <stop stop-color="#00F5FF"/>
      <stop offset="1" stop-color="#8A2BE2"/>
    </linearGradient>

    <linearGradient id="foldGradient" x1="44" y1="10" x2="54" y2="20">
      <stop stop-color="#8A2BE2"/>
      <stop offset="1" stop-color="#00F5FF"/>
    </linearGradient>

    <linearGradient id="sparkGradient" x1="42" y1="8" x2="58" y2="24">
      <stop stop-color="#FFD700"/>
      <stop offset="1" stop-color="#FF00CC"/>
    </linearGradient>

    <!-- Spark Animation -->
    <style>
      .spark {
        transform-origin: 50% 50%;
        animation: sparkTwinkle 3s ease-in-out infinite;
      }

      @keyframes sparkTwinkle {
        0%   { transform: scale(1) rotate(0deg); opacity: 1; }
        50%  { transform: scale(1.15) rotate(8deg); opacity: 0.85; }
        100% { transform: scale(1) rotate(0deg); opacity: 1; }
      }
    </style>

  </defs>

  <!-- Paper Body -->
  <rect x="14"
        y="10"
        width="30"
        height="44"
        rx="6"
        fill="url(#paperGradient)" />

  <!-- Fold Corner -->
  <path d="M44 10L54 20H44V10Z"
        fill="url(#foldGradient)" />

  <!-- Animated Spark -->
  <path class="spark"
        d="M50 8
           L52 14
           L58 16
           L52 18
           L50 24
           L48 18
           L42 16
           L48 14
           L50 8Z"
        fill="url(#sparkGradient)" />

</svg>
